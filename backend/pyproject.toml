[project]
name = "flashcard-backend"
version = "0.1.0"
description = "Serverless backend for the AI flashcard generator"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "boto3",
]

[dependency-groups]
dev = [
    "moto[dynamodb,ssm]",
    "pytest",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["lambda_functions"]
testpaths = ["tests"]

# Not a package: the Lambda code in lambda_functions/ is deployed by SAM.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["lambda_functions", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
